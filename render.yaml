services:
  - type: web
    name: pipesense-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend_v2.api.main:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PIPESENSE_MODE
        value: local
      - key: USE_AWS_BEDROCK
        value: "false"
      - key: ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
